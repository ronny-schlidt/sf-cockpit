name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux only: macOS and Windows runners cost 10x and 2x minutes in private repositories.
    # The release workflow still builds and links every platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
